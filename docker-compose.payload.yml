# Optional overlay: docker compose -f docker-compose.yml -f docker-compose.payload.yml ...
# No profiles: omission of this file leaves the original Portal stack independent.
x-cms-image: &cms-image
  image: ${CMS_IMAGE:-local/ownerinc-portal-cms:latest}
  build:
    context: .
    dockerfile: cms/Dockerfile
x-cms-environment: &cms-environment
  NODE_ENV: production
  CMS_PUBLICATION_MODE: manual
  CMS_DATABASE_URL: ${CMS_RUNTIME_DATABASE_URL:?Set CMS_RUNTIME_DATABASE_URL}
  PAYLOAD_SECRET: ${PAYLOAD_SECRET:?Set PAYLOAD_SECRET}
  PORTAL_PUBLIC_URL: ${PORTAL_PUBLIC_URL:?Set PORTAL_PUBLIC_URL}
  PORTAL_INTERNAL_URL: http://api:3000
  PAYLOAD_TO_PORTAL_SECRET: ${PAYLOAD_TO_PORTAL_SECRET:?Set PAYLOAD_TO_PORTAL_SECRET}
  PORTAL_TO_PAYLOAD_SECRET: ${PORTAL_TO_PAYLOAD_SECRET:?Set PORTAL_TO_PAYLOAD_SECRET}
  CMS_UPLOAD_DIR: /var/lib/ownerinc-cms/media

services:
  api:
    environment:
      CMS_INTERNAL_URL: http://cms:3001
      PAYLOAD_TO_PORTAL_SECRET: ${PAYLOAD_TO_PORTAL_SECRET:?Set PAYLOAD_TO_PORTAL_SECRET}
      PORTAL_TO_PAYLOAD_SECRET: ${PORTAL_TO_PAYLOAD_SECRET:?Set PORTAL_TO_PAYLOAD_SECRET}

  cms-cluster-bootstrap:
    <<: *cms-image
    profiles: [cms-bootstrap]
    command: [node, --import, tsx, scripts/provision-db.ts, --bootstrap-database]
    environment:
      CMS_DATABASE_URL: postgresql://${POSTGRES_USER:-portal_admin}:${POSTGRES_PASSWORD:?Set POSTGRES_PASSWORD}@postgres:5432/postgres
      CMS_PORTAL_DATABASE_NAME: ${POSTGRES_DB:-portal}
      CMS_POSTGRES_PASSWORD: ${CMS_POSTGRES_PASSWORD:?Set CMS_POSTGRES_PASSWORD}
      CMS_CONTROLLER_PASSWORD: ${CMS_CONTROLLER_PASSWORD:?Set CMS_CONTROLLER_PASSWORD}
      CMS_MIGRATOR_PASSWORD: ${CMS_MIGRATOR_PASSWORD:?Set CMS_MIGRATOR_PASSWORD}
      CMS_RUNTIME_PASSWORD: ${CMS_RUNTIME_PASSWORD:?Set CMS_RUNTIME_PASSWORD}
      CMS_OBSERVER_PASSWORD: ${CMS_OBSERVER_PASSWORD:?Set CMS_OBSERVER_PASSWORD}
    depends_on:
      postgres:
        condition: service_healthy
    restart: "no"

  cms-provision:
    <<: *cms-image
    environment:
      CMS_DATABASE_URL: ${CMS_OWNER_DATABASE_URL:?Set CMS_OWNER_DATABASE_URL}
      CMS_PORTAL_DATABASE_NAME: ${POSTGRES_DB:-portal}
    command: [node, --import, tsx, scripts/provision-db.ts, --provision]
    depends_on:
      postgres:
        condition: service_healthy
    restart: 'no'

  # Profiled one-shot role verification/bootstrap; the controller credential is
  # never passed to the CMS web, worker, ordinary provisioner, or migrator.
  cms-control-roles:
    <<: *cms-image
    profiles: [cms-control-roles]
    environment:
      CMS_DATABASE_URL: ${CMS_OWNER_DATABASE_URL:?Set CMS_OWNER_DATABASE_URL}
      CMS_PORTAL_DATABASE_NAME: ${POSTGRES_DB:-portal}
      CMS_CONTROLLER_PASSWORD: ${CMS_CONTROLLER_PASSWORD:?Set CMS_CONTROLLER_PASSWORD}
    command: [node, --import, tsx, scripts/provision-db.ts, --verify-control]
    depends_on:
      postgres:
        condition: service_healthy
    restart: 'no'

  cms-migrate:
    <<: *cms-image
    environment:
      <<: *cms-environment
      CMS_DATABASE_URL: ${CMS_MIGRATION_DATABASE_URL:?Set CMS_MIGRATION_DATABASE_URL}
      CMS_PORTAL_DATABASE_NAME: ${POSTGRES_DB:-portal}
    command: [sh, -ec, 'node --import tsx scripts/provision-db.ts --verify-migrator && npm run migrate && node --import tsx scripts/provision-db.ts --grants']
    depends_on:
      cms-provision:
        condition: service_completed_successfully
    restart: 'no'

  # Explicitly invoked read-only native-catalog verifier. It is never part of
  # `up`; the host adapter runs it only while the shared operation lease is held.
  cms-preauthority-verify:
    <<: *cms-image
    environment:
      CMS_ADMIN_DATABASE_URL: ${CMS_OWNER_DATABASE_URL:?Set CMS_OWNER_DATABASE_URL}
      CMS_PORTAL_DATABASE_NAME: ${POSTGRES_DB:-portal}
    command: [node, --import, tsx, scripts/verify-preauthority-catalog.ts]
    restart: 'no'

  cms:
    <<: *cms-image
    environment: *cms-environment
    command: [sh, -ec, 'node --import tsx scripts/provision-db.ts --verify-runtime && exec node node_modules/next/dist/bin/next start --port 3001']
    volumes:
      - cms_uploads_data:/var/lib/ownerinc-cms/media
    depends_on:
      cms-migrate:
        condition: service_completed_successfully
    healthcheck:
      test: [CMD, node, -e, 'fetch("http://127.0.0.1:3001/editorial/ready").then(r=>process.exit(r.ok?0:1)).catch(()=>process.exit(1))']
      interval: 10s
      timeout: 6s
      retries: 12
      start_period: 30s
    stop_grace_period: 60s
    restart: unless-stopped

  nginx:
    depends_on:
      cms:
        condition: service_healthy

volumes:
  cms_uploads_data:
