<!DOCTYPE html>
<html lang="pt-BR">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <meta name="theme-color" content="#0F0F0F">
  <title>Benefícios — Portal Ownerinc</title>
  <link rel="stylesheet" href="./css/tokens.css">
  <link rel="stylesheet" href="./css/layout.css">
  <link rel="stylesheet" href="./css/components.css">
  <link rel="stylesheet" href="./css/cms.css">
  <script src="./js/auth-shell.js"></script>
  <script defer src="https://unpkg.com/lucide@0.441.0/dist/umd/lucide.min.js" integrity="sha384-+BmuXGyhRt0m3keXGimGlGjRHSt5U+wqLV71/sdbtxPN7ep6z3rHVT6Wp7q3K240" crossorigin="anonymous"></script>
</head>
<body>
<a class="skip-link" href="#main-content">Pular para o conteúdo</a>
<div class="portal-wrapper">
  <aside class="sidebar" aria-label="Navegação principal">
    <div class="sidebar-header">
      <a href="./dashboard.html" class="sidebar-brand">
        <img src="./assets/logo-branco.svg" alt="Ownerinc" class="logo-full" width="130" height="26">
        <img src="./assets/icon-branco.svg" alt="" class="logo-icon" width="28" height="28" style="display:none">
      </a>
      <button class="sidebar-toggle" id="sidebar-toggle" type="button" aria-label="Recolher menu" aria-expanded="true">
        <i data-lucide="chevrons-left"></i>
      </button>
    </div>
    <ul class="sidebar-nav">
      <li><a href="./dashboard.html" title="Dashboard"><i data-lucide="home"></i><span>Dashboard</span></a></li>
      <li><a href="./knowledge.html" title="Base de Conhecimento"><i data-lucide="book-open"></i><span>Base de Conhecimento</span></a></li>
      <li><a href="./reminders.html" title="Lembretes"><i data-lucide="bell"></i><span>Lembretes</span></a></li>
      <li><a href="./academy.html" title="Academy"><i data-lucide="graduation-cap"></i><span>Academy</span></a></li>
      <li><a href="./benefits.html" class="active" title="Benefícios"><i data-lucide="gift"></i><span>Benefícios</span></a></li>
      <li><a href="./profile.html" title="Meu Perfil"><i data-lucide="user"></i><span>Meu Perfil</span></a></li>
      <li id="admin-link" class="admin-link"><a href="./admin.html" title="Admin"><i data-lucide="settings-2"></i><span>Admin</span></a></li>
      <li class="autocard-link"><a href="./autocard.html" title="AutoCard"><i data-lucide="layout-template"></i><span>AutoCard</span></a></li>
    </ul>
    <div class="sidebar-footer">
      <button class="sidebar-logout" type="button" aria-label="Sair">
        <i data-lucide="log-out"></i><span>Sair</span>
      </button>
    </div>
  </aside>
  <div class="main-content">
    <header class="topbar">
      <span class="topbar-title">Benefícios</span>
    </header>
    <main class="page-body" id="main-content" tabindex="-1">
      <div class="page-header"><h1>Benefícios</h1><p>Parcerias e vantagens disponíveis para a equipe</p></div>
      <div id="benefits-filters" class="filters" aria-label="Filtrar benefícios por categoria"></div>
      <div id="benefits-content" aria-live="polite">
        <p class="empty-state">Carregando benefícios…</p>
      </div>
      <div id="benefits-pagination" class="pagination" aria-live="polite"></div>
    </main>
  </div>
</div>
<div id="toast" class="toast hidden" aria-live="polite"></div>
<script src="./js/sidebar.js"></script>
<script type="module" src="./js/benefits.js"></script>
</body>
</html>
