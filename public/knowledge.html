<!DOCTYPE html>
<html lang="pt-BR">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <meta name="theme-color" content="#0F0F0F">
  <title>Base de Conhecimento — Portal Ownerinc</title>
  <link rel="stylesheet" href="./css/tokens.css">
  <link rel="stylesheet" href="./css/layout.css">
  <link rel="stylesheet" href="./css/components.css">
  <script src="./js/auth-shell.js"></script>
  <script defer src="https://unpkg.com/lucide@0.441.0/dist/umd/lucide.min.js" integrity="sha384-+BmuXGyhRt0m3keXGimGlGjRHSt5U+wqLV71/sdbtxPN7ep6z3rHVT6Wp7q3K240" crossorigin="anonymous"></script>
</head>
<body>
<a class="skip-link" href="#main-content">Pular para o conteúdo</a>
<div class="portal-wrapper">
  <aside class="sidebar" aria-label="Navegação principal">
    <div class="sidebar-header">
      <a href="./dashboard.html" class="sidebar-brand">
        <img src="./assets/logo-branco.svg" alt="Ownerinc" class="logo-full" width="130" height="26">
        <img src="./assets/icon-branco.svg" alt="" class="logo-icon" width="28" height="28" style="display:none">
      </a>
      <button class="sidebar-toggle" id="sidebar-toggle" type="button" aria-label="Recolher menu" aria-expanded="true">
        <i data-lucide="chevrons-left"></i>
      </button>
    </div>
    <ul class="sidebar-nav">
      <li><a href="./dashboard.html" title="Dashboard"><i data-lucide="home"></i><span>Dashboard</span></a></li>
      <li><a href="./knowledge.html" class="active" title="Base de Conhecimento"><i data-lucide="book-open"></i><span>Base de Conhecimento</span></a></li>
      <li><a href="./reminders.html" title="Lembretes"><i data-lucide="bell"></i><span>Lembretes</span></a></li>
      <li><a href="./academy.html" title="Academy"><i data-lucide="graduation-cap"></i><span>Academy</span></a></li>
      <li><a href="./benefits.html" title="Benefícios"><i data-lucide="gift"></i><span>Benefícios</span></a></li>
      <li><a href="./ombudsman.html" title="Ouvidoria"><i data-lucide="message-square"></i><span>Ouvidoria</span></a></li>
      <li><a href="./profile.html" title="Meu Perfil"><i data-lucide="user"></i><span>Meu Perfil</span></a></li>
      <li id="admin-link" class="admin-link"><a href="./admin.html" title="Admin"><i data-lucide="settings-2"></i><span>Admin</span></a></li>
    </ul>
    <div class="sidebar-footer">
      <button class="sidebar-logout" type="button" aria-label="Sair">
        <i data-lucide="log-out"></i><span>Sair</span>
      </button>
    </div>
  </aside>

  <div class="main-content">
    <header class="topbar">
      <span class="topbar-title">Base de Conhecimento</span>
      <div class="topbar-actions">
        <label class="search-bar" for="search">
          <span aria-hidden="true">🔍</span>
          <input type="search" id="search" name="search" autocomplete="off" placeholder="Buscar artigos…" aria-label="Buscar artigos">
        </label>
        <button id="btn-new" class="btn btn-primary" type="button" style="display:none">Novo artigo</button>
      </div>
    </header>
    <main class="page-body" id="main-content" tabindex="-1">

      <div class="page-header"><h1>Base de Conhecimento</h1></div>

      <!-- Category filter -->
      <div id="categories" style="display:flex; gap:8px; flex-wrap:wrap; margin-bottom:24px"></div>

      <!-- Articles list -->
      <div id="articles-list" class="card-grid" aria-live="polite">
        <p class="empty-state">Carregando…</p>
      </div>

      <!-- Article view -->
      <article id="article-view" class="card article-view" hidden>
        <button id="btn-back" class="btn btn-ghost btn-sm" style="margin-bottom:16px">← Voltar</button>
        <div id="article-admin-bar" class="actions" style="margin-bottom:16px" hidden></div>
        <h2 id="article-title" tabindex="-1"></h2>
        <span id="article-category" class="badge badge-gold" style="margin-bottom:16px; display:inline-flex"></span>
        <div id="article-content" class="article-content"></div>
      </article>

    </main>
  </div>
</div>

<!-- Modal: criar/editar artigo -->
<div id="modal-article" class="modal-backdrop hidden" role="dialog" aria-modal="true" aria-labelledby="modal-article-title">
  <form class="modal" id="article-form" autocomplete="off">
    <div class="modal-header">
      <span class="modal-title" id="modal-article-title">Novo Artigo</span>
      <button class="modal-close" id="modal-article-close" type="button" aria-label="Fechar">×</button>
    </div>
    <div class="form-group">
      <label class="form-label" for="f-title">Título</label>
      <input class="form-input" id="f-title" name="title" type="text" required placeholder="Ex.: Política de viagens…" autocomplete="off">
    </div>
    <div class="form-group">
      <label class="form-label" for="f-category">Categoria</label>
      <input class="form-input" id="f-category" name="category" type="text" placeholder="Ex.: RH, Financeiro, Operações…" autocomplete="off">
    </div>
    <div class="form-group">
      <label class="form-label" for="f-content">Conteúdo</label>
      <textarea class="form-textarea" id="f-content" name="content" rows="8" required placeholder="Conteúdo em texto simples…"></textarea>
    </div>
    <div style="display:flex; gap:8px; justify-content:flex-end">
      <button class="btn btn-ghost" type="button" id="modal-article-cancel">Cancelar</button>
      <button class="btn btn-primary" type="submit" id="modal-article-save">Salvar</button>
    </div>
  </form>
</div>

<div id="toast" class="toast hidden" aria-live="polite"></div>
<script src="./js/sidebar.js"></script>
<script type="module" src="./js/knowledge.js"></script>
</body>
</html>
