<!DOCTYPE html>
<html lang="pt-BR">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <meta name="theme-color" content="#0F0F0F">
  <title>Owner News — Portal Ownerinc</title>
  <link rel="stylesheet" href="./css/tokens.css">
  <link rel="stylesheet" href="./css/layout.css">
  <link rel="stylesheet" href="./css/components.css">
  <link rel="stylesheet" href="./css/cms.css">
  <link rel="stylesheet" href="./css/owner-news.css">
  <script src="./js/auth-shell.js"></script>
</head>
<body class="cms-page">
<script src="./js/sidebar-state.js"></script>
<a class="skip-link" href="#main-content">Pular para o conteúdo</a>
<div class="portal-wrapper">
  <aside class="sidebar" aria-label="Navegação principal">
    <div class="sidebar-header">
      <a href="./dashboard.html" class="sidebar-brand"><img src="./assets/logo-branco.svg" alt="Ownerinc" class="logo-full" width="130" height="26"><img src="./assets/icon-branco.svg" alt="" class="logo-icon" width="28" height="28" style="display:none"></a>
      <button class="sidebar-toggle" id="sidebar-toggle" type="button" aria-label="Recolher menu" aria-expanded="true"><svg class="icon" aria-hidden="true"><use href="./assets/icons.svg#chevrons-left"></use></svg></button>
    </div>
    <!-- generated:portal-sidebar -->
    <ul class="sidebar-nav">
      <li><a href="./dashboard.html" title="Dashboard"><svg class="icon" aria-hidden="true"><use href="./assets/icons.svg#home"></use></svg><span>Dashboard</span></a></li>
      <li><a href="./knowledge.html" title="Base de Conhecimento"><svg class="icon" aria-hidden="true"><use href="./assets/icons.svg#book-open"></use></svg><span>Base de Conhecimento</span></a></li>
      <li><a href="./reminders.html" title="Lembretes"><svg class="icon" aria-hidden="true"><use href="./assets/icons.svg#bell"></use></svg><span>Lembretes</span></a></li>
      <li><a href="./academy.html" title="Academy"><svg class="icon" aria-hidden="true"><use href="./assets/icons.svg#graduation-cap"></use></svg><span>Academy</span></a></li>
      <li><a href="./announcements.html" class="active" aria-current="page" title="Owner News"><svg class="icon" aria-hidden="true"><use href="./assets/icons.svg#megaphone"></use></svg><span>Owner News</span></a></li>
      <li><a href="./profile.html" title="Meu Perfil"><svg class="icon" aria-hidden="true"><use href="./assets/icons.svg#user"></use></svg><span>Meu Perfil</span></a></li>
      <li id="admin-link" class="admin-link"><a href="./admin.html" title="Admin"><svg class="icon" aria-hidden="true"><use href="./assets/icons.svg#settings-2"></use></svg><span>Admin</span></a></li>
      <li class="cms-link"><a href="./cms.html" title="Editor CMS"><svg class="icon" aria-hidden="true"><use href="./assets/icons.svg#file-edit"></use></svg><span>Editor CMS</span></a></li>
      <li class="autocard-link"><a href="./autocard.html" title="AutoCard"><svg class="icon" aria-hidden="true"><use href="./assets/icons.svg#layout-template"></use></svg><span>AutoCard</span></a></li>
      <li class="pos-cards-link"><a href="./cards-pos.html" title="Cards Pós"><svg class="icon" aria-hidden="true"><use href="./assets/icons.svg#badge-check"></use></svg><span>Cards Pós</span></a></li>
    </ul>
    <!-- /generated:portal-sidebar -->
    <div class="sidebar-footer"><button class="sidebar-logout" type="button" aria-label="Sair"><svg class="icon" aria-hidden="true"><use href="./assets/icons.svg#log-out"></use></svg><span>Sair</span></button></div>
  </aside>
  <div class="main-content">
    <!-- generated:portal-topbar -->
    <header class="topbar"><span class="topbar-title">Owner News</span></header>
    <!-- /generated:portal-topbar -->
    <main class="page-body news-page" id="main-content" tabindex="-1" data-route-pending>
      <div id="news-index">
        <header id="news-highlight" class="news-opening" aria-live="polite"><h1>Owner News</h1></header>
        <div id="news-opening-status" class="news-loader-status" aria-live="polite"></div>
        <div id="news-highlight-status" class="news-loader-status" aria-live="polite"></div>
        <nav id="news-categories" class="news-categories" aria-label="Editorias"></nav>
        <div id="news-categories-status" class="news-loader-status" aria-live="polite"></div>
        <h2 id="news-catalog-title" class="news-section-title" tabindex="-1">Últimas publicações</h2>
      </div>
      <div id="news-feed-status" class="news-loader-status" aria-live="polite"></div>
      <div id="announcements-list" class="announcements-list news-mosaic" aria-live="polite"><p class="empty-state">Carregando publicações…</p></div>
      <div id="announcements-pagination" class="pagination" aria-label="Paginação de publicações"></div>
    </main>
  </div>
</div>
<div id="toast" class="toast hidden" aria-live="polite"></div>
<div id="news-reader-overlay" class="news-reader hidden" data-page-overlay>
  <section id="news-reader-dialog" role="dialog" aria-modal="true" aria-label="Leitura da Owner News">
    <header class="news-reader-toolbar">
      <button id="news-reader-previous" type="button" disabled>← Anterior</button>
      <span class="news-reader-brand">Owner News</span>
      <div><button id="news-reader-next" type="button" disabled>Próxima →</button>
      <button id="news-reader-close" type="button">Voltar ×</button></div>
    </header>
    <div id="news-reader-navigation-status" class="news-loader-status" aria-live="polite"></div>
    <div id="news-reader-content"></div>
  </section>
</div>
<script src="./js/sidebar.js"></script>
<script type="module" src="./js/router-bootstrap.js"></script>
</body>
</html>
