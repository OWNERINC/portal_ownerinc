<!DOCTYPE html>
<html lang="pt-BR">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Lembretes — Portal Ownerinc</title>
  <link rel="stylesheet" href="./css/tokens.css">
  <link rel="stylesheet" href="./css/layout.css">
  <link rel="stylesheet" href="./css/components.css">
  <script src="https://unpkg.com/lucide@0.441.0/dist/umd/lucide.min.js"></script>
</head>
<body>
<div class="portal-wrapper">
  <aside class="sidebar">
    <div class="sidebar-header">
      <a href="./dashboard.html" class="sidebar-brand">
        <img src="./assets/logo-branco.svg" alt="Ownerinc" class="logo-full">
        <img src="./assets/icon-branco.svg" alt="Ownerinc" class="logo-icon" style="display:none">
      </a>
      <button class="sidebar-toggle" id="sidebar-toggle" title="Recolher menu">
        <i data-lucide="chevrons-left"></i>
      </button>
    </div>
    <ul class="sidebar-nav">
      <li><a href="./dashboard.html" title="Dashboard"><i data-lucide="home"></i><span>Dashboard</span></a></li>
      <li><a href="./knowledge.html" title="Base de Conhecimento"><i data-lucide="book-open"></i><span>Base de Conhecimento</span></a></li>
      <li><a href="./reminders.html" class="active" title="Lembretes"><i data-lucide="bell"></i><span>Lembretes</span></a></li>
      <li><a href="./academy.html" title="Academy"><i data-lucide="graduation-cap"></i><span>Academy</span></a></li>
      <li><a href="./benefits.html" title="Benefícios"><i data-lucide="gift"></i><span>Benefícios</span></a></li>
      <li><a href="./ombudsman.html" title="Ouvidoria"><i data-lucide="message-square"></i><span>Ouvidoria</span></a></li>
      <li><a href="./profile.html" title="Meu Perfil"><i data-lucide="user"></i><span>Meu Perfil</span></a></li>
      <li id="admin-link" style="display:none"><a href="./admin.html" title="Admin"><i data-lucide="settings-2"></i><span>Admin</span></a></li>
    </ul>
    <div class="sidebar-footer">
      <button class="sidebar-logout" onclick="import('./js/auth.js').then(m=>m.logout())" title="Sair">
        <i data-lucide="log-out"></i><span>Sair</span>
      </button>
    </div>
  </aside>
  <div class="main-content">
    <header class="topbar">
      <span class="topbar-title">Lembretes</span>
      <div style="display:flex; gap:12px; align-items:center">
        <button id="btn-new-reminder" class="btn btn-primary" style="display:none">+ Novo</button>
        <span class="topbar-user">Olá, <strong id="topbar-user-name"></strong></span>
      </div>
    </header>
    <main class="page-body">
      <div class="table-wrapper">
        <table>
          <thead>
            <tr>
              <th>Título</th><th>Dia do mês</th><th>Destinatários</th>
              <th>Canal</th><th>Status</th><th id="th-actions"></th>
            </tr>
          </thead>
          <tbody id="reminders-tbody">
            <tr><td colspan="6" class="empty-state">Carregando...</td></tr>
          </tbody>
        </table>
      </div>
    </main>
  </div>
</div>

<!-- Modal lembrete -->
<div id="modal-reminder" class="modal-backdrop hidden">
  <div class="modal">
    <div class="modal-header">
      <span class="modal-title" id="modal-reminder-title">Novo Lembrete</span>
      <button class="modal-close" id="modal-reminder-close">×</button>
    </div>
    <div class="form-group">
      <label class="form-label">Título</label>
      <input class="form-input" id="r-title" type="text" placeholder="Ex: Emissão de Nota Fiscal PJ">
    </div>
    <div class="form-group">
      <label class="form-label">Descrição</label>
      <input class="form-input" id="r-desc" type="text" placeholder="Detalhe do lembrete">
    </div>
    <div class="form-group">
      <label class="form-label">Dia do mês (1–31)</label>
      <input class="form-input" id="r-day" type="number" min="1" max="31">
    </div>
    <div class="form-group">
      <label class="form-label">Destinatários</label>
      <select class="form-select" id="r-target">
        <option value="all">Todos</option>
        <option value="pj">Apenas PJ</option>
        <option value="clt">Apenas CLT</option>
      </select>
    </div>
    <div class="form-group">
      <label class="form-label">Canal</label>
      <select class="form-select" id="r-channel">
        <option value="email">E-mail</option>
      </select>
    </div>
    <div class="form-group" style="flex-direction:row; align-items:center; gap:8px">
      <input type="checkbox" id="r-active" checked>
      <label class="form-label" for="r-active" style="margin:0">Ativo</label>
    </div>
    <div style="display:flex; gap:8px; justify-content:flex-end; margin-top:8px">
      <button class="btn btn-ghost" id="modal-reminder-cancel">Cancelar</button>
      <button class="btn btn-primary" id="modal-reminder-save">Salvar</button>
    </div>
  </div>
</div>

<div id="toast" class="toast hidden"></div>
<script>lucide.createIcons();</script>
<script src="./js/sidebar.js"></script>
<script type="module" src="./js/reminders.js"></script>
</body>
</html>
