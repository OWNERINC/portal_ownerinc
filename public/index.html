<!DOCTYPE html>
<html lang="pt-BR">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <meta name="theme-color" content="#F7F6F2">
  <title>Conecta Ownerinc</title>
  <link rel="stylesheet" href="./css/tokens.css">
  <link rel="icon" href="./assets/conecta/symbol.svg" type="image/svg+xml">
  <style>
    body {
      min-height: 100vh;
      margin: 0;
      display: grid;
      place-items: center;
      background: var(--bg);
      color: var(--text);
      font-family: var(--font-sans);
    }
    main {
      display: grid;
      justify-items: center;
      gap: 24px;
      text-align: center;
    }
    main img {
      width: 72px;
      height: auto;
      animation: portal-pulse 2.8s ease-in-out infinite;
    }
    main p {
      margin: 0;
      color: var(--text-secondary);
      font-size: 14px;
      letter-spacing: .04em;
    }
    @keyframes portal-pulse {
      0%, 100% { opacity: .35; }
      50% { opacity: 1; }
    }
    @media (prefers-reduced-motion: reduce) {
      main img { animation: none; opacity: .75; }
    }
  </style>
</head>
<body>
  <main aria-live="polite">
    <img src="./assets/conecta/symbol.svg" alt="" width="72" height="39">
    <p>Verificando acesso…</p>
  </main>
  <noscript><p>Ative o JavaScript para acessar o Conecta Ownerinc.</p></noscript>
  <script type="module" src="./js/index.js"></script>
</body>
</html>
