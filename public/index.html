<!DOCTYPE html>
<html lang="pt-BR">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <meta name="theme-color" content="#0F0F0F">
  <title>Portal Ownerinc</title>
  <link rel="stylesheet" href="./css/tokens.css">
  <style>
    :root { color-scheme: dark; }
    body {
      min-height: 100vh;
      margin: 0;
      display: grid;
      place-items: center;
      background: #000;
      color: #fff;
      font-family: var(--font-sans);
    }
    main {
      display: grid;
      justify-items: center;
      gap: 24px;
      text-align: center;
    }
    main img {
      width: 72px;
      height: 72px;
      animation: portal-pulse 2.8s ease-in-out infinite;
    }
    main p {
      margin: 0;
      color: rgba(255, 255, 255, .68);
      font-size: 14px;
      letter-spacing: .04em;
    }
    @keyframes portal-pulse {
      0%, 100% { opacity: .35; }
      50% { opacity: 1; }
    }
    @media (prefers-reduced-motion: reduce) {
      main img { animation: none; opacity: .75; }
    }
  </style>
</head>
<body>
  <main aria-live="polite">
    <img src="./assets/icon-branco.svg" alt="">
    <p>Verificando acesso…</p>
  </main>
  <noscript><p>Ative o JavaScript para acessar o Portal Ownerinc.</p></noscript>
  <script type="module" src="./js/index.js"></script>
</body>
</html>
