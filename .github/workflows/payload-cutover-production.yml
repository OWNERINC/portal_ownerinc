name: Payload production cutover

on:
  workflow_dispatch:
    inputs:
      commit:
        description: Exact current main commit
        required: true
        type: string
      epoch:
        description: Current legacy authority epoch
        required: true
        type: string
      release_digest:
        description: Gate C candidate receipt digest
        required: true
        type: string
      image_digest:
        description: Installed CMS image digest
        required: true
        type: string
      manifest_sha256:
        description: Sealed CMS migration manifest identifier
        required: true
        type: string
      seal_sha256:
        description: Expected CMS seal receipt identifier
        required: true
        type: string
      b1_proof_sha256:
        description: Private B1 receipt identifier
        required: true
        type: string
      window_expires_at:
        description: Absolute approved deadline, no more than 60 minutes ahead
        required: true
        type: string
      editor_uid:
        required: true
        type: string
      operator_uid:
        required: true
        type: string

permissions:
  contents: read

concurrency:
  group: portal-ownerinc-production
  cancel-in-progress: false

jobs:
  preflight:
    timeout-minutes: 60
    runs-on: [self-hosted, linux, production]
    environment: payload-cutover-preflight
    steps:
      - uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683 # v4.2.2
        with:
          ref: main
          persist-credentials: false
      - name: Qualify private host evidence
        shell: bash
        env:
          APPROVAL_BINDING: ${{ secrets.PREFLIGHT_APPROVAL_BINDING }}
          REQUEST_COMMIT: ${{ inputs.commit }}
          AUTHORITY_EPOCH: ${{ inputs.epoch }}
          RELEASE_DIGEST: ${{ inputs.release_digest }}
          IMAGE_DIGEST: ${{ inputs.image_digest }}
          B1_PROOF_SHA256: ${{ inputs.b1_proof_sha256 }}
          WINDOW_DEADLINE: ${{ inputs.window_expires_at }}
          EDITOR_UID: ${{ inputs.editor_uid }}
          OPERATOR_UID: ${{ inputs.operator_uid }}
          CUTOVER_REQUEST_ID: gate-e-${{ github.run_id }}-${{ github.run_attempt }}
        run: |
          set -euo pipefail
          test -n "$APPROVAL_BINDING"
          test "$GITHUB_REF" = refs/heads/main
          test "$(git rev-parse HEAD)" = "$REQUEST_COMMIT"
          test "$GITHUB_SHA" = "$REQUEST_COMMIT"
          test "$EDITOR_UID" != "$OPERATOR_UID"
          /usr/bin/sudo -n -u ownerinc-cutover /usr/local/sbin/payload-gate-e-guard preflight \
            /var/lib/ownerinc/payload-control "$REQUEST_COMMIT" "$AUTHORITY_EPOCH" \
            "$RELEASE_DIGEST" "$IMAGE_DIGEST" - - "$B1_PROOF_SHA256" "$WINDOW_DEADLINE" \
            "$EDITOR_UID" "$OPERATOR_UID" "$CUTOVER_REQUEST_ID"

  activate:
    needs: preflight
    timeout-minutes: 60
    runs-on: [self-hosted, linux, production]
    environment: payload-cutover-activation
    steps:
      # This checkout happens only after the activation Environment approval. It
      # re-resolves current main instead of trusting the pre-approval workspace.
      - uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683 # v4.2.2
        with:
          ref: main
          persist-credentials: false
      - name: Re-observe and activate before the absolute deadline
        shell: bash
        env:
          APPROVAL_BINDING: ${{ secrets.ACTIVATION_APPROVAL_BINDING }}
          REQUEST_COMMIT: ${{ inputs.commit }}
          AUTHORITY_EPOCH: ${{ inputs.epoch }}
          RELEASE_DIGEST: ${{ inputs.release_digest }}
          IMAGE_DIGEST: ${{ inputs.image_digest }}
          MANIFEST_SHA256: ${{ inputs.manifest_sha256 }}
          SEAL_SHA256: ${{ inputs.seal_sha256 }}
          B1_PROOF_SHA256: ${{ inputs.b1_proof_sha256 }}
          WINDOW_DEADLINE: ${{ inputs.window_expires_at }}
          EDITOR_UID: ${{ inputs.editor_uid }}
          OPERATOR_UID: ${{ inputs.operator_uid }}
          CUTOVER_REQUEST_ID: gate-e-${{ github.run_id }}-${{ github.run_attempt }}
        run: |
          set -euo pipefail
          test -n "$APPROVAL_BINDING"
          test "$GITHUB_REF" = refs/heads/main
          test "$(git rev-parse HEAD)" = "$REQUEST_COMMIT"
          test "$GITHUB_SHA" = "$REQUEST_COMMIT"
          test "$EDITOR_UID" != "$OPERATOR_UID"
          # The fixed host wrapper opens its private HMAC key on FD 9. It verifies
          # B1, Gate C/D state and route receipts, then creates fresh feed/drain
          # receipts. No signing key or receipt body enters the runner workspace.
          /usr/bin/sudo -n -u ownerinc-cutover /usr/local/sbin/payload-gate-e-guard activate \
            /var/lib/ownerinc/payload-control "$REQUEST_COMMIT" "$AUTHORITY_EPOCH" \
            "$RELEASE_DIGEST" "$IMAGE_DIGEST" "$MANIFEST_SHA256" "$SEAL_SHA256" \
            "$B1_PROOF_SHA256" "$WINDOW_DEADLINE" "$EDITOR_UID" "$OPERATOR_UID" \
            "$CUTOVER_REQUEST_ID"
