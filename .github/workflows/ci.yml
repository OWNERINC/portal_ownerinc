name: CI

on:
  workflow_dispatch:
  pull_request:
  push:
    branches: [main]

permissions:
  contents: read
  packages: write

jobs:
  validate:
    outputs:
      api_image: ${{ steps.publish.outputs.api_image }}
      cron_image: ${{ steps.publish.outputs.cron_image }}
    runs-on: ubuntu-latest
    services:
      postgres:
        image: postgres:16-alpine@sha256:57c72fd2a128e416c7fcc499958864df5301e940bca0a56f58fddf30ffc07777
        env:
          POSTGRES_DB: portal_test
          POSTGRES_USER: portal_admin
          POSTGRES_PASSWORD: integration-test-admin-password
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U portal_admin -d portal_test"
          --health-interval 5s
          --health-timeout 5s
          --health-retries 10
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7.0.0
        with:
          node-version: 24
          cache: npm
          cache-dependency-path: |
           api/package-lock.json
           cron/package-lock.json
           cms/package-lock.json
      - run: npm run bootstrap
      - run: npm run verify
      - name: Test route delivery with production Nginx image
        run: |
          docker run --rm \
            --mount "type=bind,source=${PWD},target=/repo,readonly" \
            --workdir /repo \
            --entrypoint sh \
            nginx:alpine@sha256:4a73073bd557c65b759505da037898b61f1be6cbcc3c2c3aeac22d2a470c1752 \
            -c 'command -v nginx && apk add --no-cache nodejs && node --test tests/unit/nginx-route-delivery.test.mjs'
      - name: Install isolated route browser tooling
        run: |
          npm install --prefix "$RUNNER_TEMP/portal-route-browser" --no-save --package-lock=false playwright@1.62.1
          node "$RUNNER_TEMP/portal-route-browser/node_modules/playwright/cli.js" install --with-deps chromium
      - name: Test route mounts through Nginx in Chromium
        timeout-minutes: 10
        run: |
          container="portal-route-qa-${GITHUB_RUN_ID}-${GITHUB_RUN_ATTEMPT}"
          trap 'docker rm --force "$container" >/dev/null 2>&1 || true' EXIT
          docker run --detach --name "$container" \
            --publish 127.0.0.1::80 \
            --mount "type=bind,source=${PWD}/public,target=/usr/share/nginx/html,readonly" \
            --mount "type=bind,source=${PWD}/nginx/nginx.conf,target=/etc/nginx/conf.d/default.conf,readonly" \
            nginx:alpine@sha256:4a73073bd557c65b759505da037898b61f1be6cbcc3c2c3aeac22d2a470c1752
          address=$(docker port "$container" 80/tcp)
          curl --fail --silent --show-error --retry 10 --retry-connrefused \
            --retry-delay 1 --max-time 5 --retry-max-time 30 \
            --output /dev/null "http://${address}/index.html"
          node scripts/test-route-recovery-browser.mjs \
            --base-url "http://${address}" \
            --playwright-module "$RUNNER_TEMP/portal-route-browser/node_modules/playwright/index.mjs"
      - name: Build CMS with synthetic build-only configuration
        env:
          CMS_BUILD_ONLY: "true"
          NEXT_TELEMETRY_DISABLED: "1"
        run: npm --prefix cms run build
      - name: Create migration setup databases
        env:
          PGPASSWORD: integration-test-admin-password
        run: |
          psql --host=127.0.0.1 --username=portal_admin --dbname=portal_test --set=ON_ERROR_STOP=1 --command="CREATE DATABASE portal_test_upgrade OWNER portal_admin"
          psql --host=127.0.0.1 --username=portal_admin --dbname=portal_test --set=ON_ERROR_STOP=1 --command="CREATE DATABASE portal_test_bootstrap OWNER portal_admin"
      - name: Test migrations against PostgreSQL
        env:
          NODE_ENV: test
          MIGRATION_TEST_DISPOSABLE: "true"
          MIGRATION_DATABASE_URL: postgresql://portal_admin:integration-test-admin-password@127.0.0.1:5432/portal_test
          PORTAL_API_DB_PASSWORD: integration-test-api-password
          PORTAL_CRON_DB_PASSWORD: integration-test-cron-password
        run: npm run test:migrations
      - name: Test migration upgrade setup against PostgreSQL
        env:
          NODE_ENV: test
          MIGRATION_TEST_DISPOSABLE: "true"
          MIGRATION_TEST_SETUP: upgrade
          MIGRATION_DATABASE_URL: postgresql://portal_admin:integration-test-admin-password@127.0.0.1:5432/portal_test_upgrade
          PORTAL_API_DB_PASSWORD: integration-test-api-password
          PORTAL_CRON_DB_PASSWORD: integration-test-cron-password
        run: npm run test:migrations
      - name: Test migration bootstrap setup against PostgreSQL
        env:
          NODE_ENV: test
          MIGRATION_TEST_DISPOSABLE: "true"
          MIGRATION_TEST_SETUP: bootstrap
          MIGRATION_DATABASE_URL: postgresql://portal_admin:integration-test-admin-password@127.0.0.1:5432/portal_test_bootstrap
          PORTAL_API_DB_PASSWORD: integration-test-api-password
          PORTAL_CRON_DB_PASSWORD: integration-test-cron-password
        run: npm run test:migrations
      - name: Test Owner News integration against PostgreSQL
        env:
          NODE_ENV: test
          MIGRATION_TEST_DISPOSABLE: "true"
          MIGRATION_DATABASE_URL: postgresql://portal_admin:integration-test-admin-password@127.0.0.1:5432/portal_test
          PORTAL_API_DB_PASSWORD: integration-test-api-password
          PORTAL_CRON_DB_PASSWORD: integration-test-cron-password
        run: node scripts/test-owner-news-integration.mjs
      - name: Test Academy integration against PostgreSQL
        env:
          NODE_ENV: test
          MIGRATION_TEST_DISPOSABLE: "true"
          MIGRATION_DATABASE_URL: postgresql://portal_admin:integration-test-admin-password@127.0.0.1:5432/portal_test
          PORTAL_API_DB_PASSWORD: integration-test-api-password
          PORTAL_CRON_DB_PASSWORD: integration-test-cron-password
        run: node scripts/test-academy.mjs
      - name: Build production images
        run: |
          docker build --tag ownerinc-portal-api:${GITHUB_SHA} api
          docker build --tag ownerinc-portal-cron:${GITHUB_SHA} --file cron/Dockerfile .
      - name: Scan API image
        uses: aquasecurity/trivy-action@ed142fd0673e97e23eac54620cfb913e5ce36c25 # v0.36.0
        with:
          image-ref: ownerinc-portal-api:${{ github.sha }}
          severity: HIGH,CRITICAL
          ignore-unfixed: true
          exit-code: 1
      - name: Scan cron image
        uses: aquasecurity/trivy-action@ed142fd0673e97e23eac54620cfb913e5ce36c25 # v0.36.0
        with:
          image-ref: ownerinc-portal-cron:${{ github.sha }}
          severity: HIGH,CRITICAL
          ignore-unfixed: true
          exit-code: 1
      - name: Reject high or critical production dependency vulnerabilities
        run: npm run security
      - name: Generate SPDX SBOMs
        run: npm run sbom
      - uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: sbom-spdx
          path: '*.spdx.json'
      - name: Authenticate to GHCR
        if: (github.event_name == 'push' || github.event_name == 'workflow_dispatch') && github.ref == 'refs/heads/main'
        uses: docker/login-action@abd2ef45e78c5afb21d64d4ca52ee8550d9572c7 # v4.5.1
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}
      - name: Publish immutable images
        id: publish
        if: (github.event_name == 'push' || github.event_name == 'workflow_dispatch') && github.ref == 'refs/heads/main'
        env:
          REGISTRY: ghcr.io/ownerinc
        run: |
          docker tag ownerinc-portal-api:${GITHUB_SHA} ${REGISTRY}/ownerinc-portal-api:${GITHUB_SHA}
          docker tag ownerinc-portal-cron:${GITHUB_SHA} ${REGISTRY}/ownerinc-portal-cron:${GITHUB_SHA}
          docker push ${REGISTRY}/ownerinc-portal-api:${GITHUB_SHA}
          docker push ${REGISTRY}/ownerinc-portal-cron:${GITHUB_SHA}
          docker inspect --format='{{index .RepoDigests 0}}' ${REGISTRY}/ownerinc-portal-api:${GITHUB_SHA} > image-digests.txt
          docker inspect --format='{{index .RepoDigests 0}}' ${REGISTRY}/ownerinc-portal-cron:${GITHUB_SHA} >> image-digests.txt
          echo "api_image=$(sed -n '1p' image-digests.txt)" >> "$GITHUB_OUTPUT"
          echo "cron_image=$(sed -n '2p' image-digests.txt)" >> "$GITHUB_OUTPUT"
      - uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        if: (github.event_name == 'push' || github.event_name == 'workflow_dispatch') && github.ref == 'refs/heads/main'
        with:
          name: image-digests
          path: image-digests.txt

  deploy-production:
    name: Deploy production
    needs: validate
    if: (github.event_name == 'push' || github.event_name == 'workflow_dispatch') && github.ref == 'refs/heads/main'
    environment: production
    runs-on: ubuntu-latest
    timeout-minutes: 25
    concurrency:
      group: portal-ownerinc-production
      cancel-in-progress: false
    permissions:
      contents: read
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - name: Package the exact validated commit
        env:
          API_IMAGE: ${{ needs.validate.outputs.api_image }}
          CRON_IMAGE: ${{ needs.validate.outputs.cron_image }}
        run: |
          printf '%s\n%s\n' "$API_IMAGE" "$CRON_IMAGE" > .ci-images
          git archive --format=tar --add-virtual-file=".ci-commit:${GITHUB_SHA}" --output=portal-release.tar "${GITHUB_SHA}"
          tar --append --file=portal-release.tar .ci-images
          gzip --stdout portal-release.tar > portal-release.tar.gz
          rm -f .ci-images portal-release.tar
      - name: Configure restricted production SSH
        env:
          SSH_PRIVATE_KEY: ${{ secrets.PORTAL_VPS_SSH_KEY }}
          SSH_KNOWN_HOSTS: ${{ secrets.PORTAL_VPS_KNOWN_HOSTS }}
        run: |
          install -d -m 700 "$HOME/.ssh"
          printf '%s\n' "$SSH_PRIVATE_KEY" > "$HOME/.ssh/portal_ownerinc_ci"
          printf '%s\n' "$SSH_KNOWN_HOSTS" > "$HOME/.ssh/known_hosts"
          chmod 600 "$HOME/.ssh/portal_ownerinc_ci" "$HOME/.ssh/known_hosts"
      - name: Deploy with backup, migration, smoke and rollback
        env:
          VPS_HOST: ${{ secrets.PORTAL_VPS_HOST }}
          VPS_PORT: ${{ secrets.PORTAL_VPS_PORT }}
          VPS_USER: ${{ secrets.PORTAL_VPS_USER }}
        run: |
          [[ "$VPS_HOST" =~ ^[A-Za-z0-9.-]+$ ]]
          [[ "$VPS_PORT" =~ ^[0-9]+$ ]]
          [[ "$VPS_USER" =~ ^[a-z_][a-z0-9_-]*$ ]]
          test "$VPS_USER" != root
          for attempt in 1 2 3; do
            if ssh -i "$HOME/.ssh/portal_ownerinc_ci" \
              -p "$VPS_PORT" \
              -o BatchMode=yes \
              -o ConnectTimeout=15 \
              -o IdentitiesOnly=yes \
              -o StrictHostKeyChecking=yes \
              "$VPS_USER@$VPS_HOST" "$GITHUB_SHA" < portal-release.tar.gz; then
              exit 0
            else
              status=$?
            fi
            if (( status != 255 || attempt == 3 )); then
              exit "$status"
            fi
            sleep $((attempt * 10))
          done
