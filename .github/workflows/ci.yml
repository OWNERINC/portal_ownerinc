name: CI

on:
  workflow_dispatch:
    inputs:
      cms_image_only:
        description: Publish only the CMS image from this branch; skip API/cron release and production deployment
        required: false
        type: boolean
        default: false
      publish_candidate_only:
        description: Publish a complete API/cron/CMS candidate from this branch after disposable API-v2 session acceptance; skip production deployment
        required: false
        type: boolean
        default: false
  pull_request:
  push:
    branches: [main]

permissions:
  contents: read
  packages: write

jobs:
  validate:
    timeout-minutes: 90
    outputs:
      api_image: ${{ steps.publish.outputs.api_image }}
      cron_image: ${{ steps.publish.outputs.cron_image }}
      cms_image: ${{ steps.publish_cms.outputs.cms_image }}
      candidate_artifact_id: ${{ steps.upload_candidate.outputs.artifact-id }}
      qualified_artifact_id: ${{ steps.upload_qualified.outputs.artifact-id }}
      recovery_report_artifact_id: ${{ steps.upload_recovery_report.outputs.artifact-id }}
    runs-on: ubuntu-latest
    services:
      postgres:
        # Service pulls precede checkout/steps: use the byte-identical public cache.
        image: mirror.gcr.io/library/postgres:16-alpine@sha256:57c72fd2a128e416c7fcc499958864df5301e940bca0a56f58fddf30ffc07777
        env:
          POSTGRES_DB: portal_test
          POSTGRES_USER: portal_admin
          POSTGRES_PASSWORD: integration-test-admin-password
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U portal_admin -d portal_test"
          --health-interval 5s
          --health-timeout 5s
          --health-retries 10
    steps:
      - name: Reject conflicting publication modes
        if: github.event_name == 'workflow_dispatch' && inputs.cms_image_only == true && inputs.publish_candidate_only == true
        run: |
          echo 'cms_image_only and publish_candidate_only cannot both be true' >&2
          exit 1
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7.0.0
        with:
          node-version: 24
          cache: npm
          cache-dependency-path: |
           api/package-lock.json
           cron/package-lock.json
           cms/package-lock.json
      - name: Verify pinned CI mirrors and configure runner pulls
        timeout-minutes: 5
        env:
          POSTGRES_SERVICE_ID: ${{ job.services.postgres.id }}
        run: |
          set -euo pipefail
          test "$RUNNER_ENVIRONMENT" = github-hosted
          test -z "${DOCKER_HOST:-}"
          test -z "${DOCKER_CONTEXT:-}"
          test "$(docker context show)" = default
          # Check raw index bytes, not tags or registry-provided digest headers.
          node --input-type=module <<'NODE'
          import { createHash } from 'node:crypto';
          const pins = [
            ['postgres', '57c72fd2a128e416c7fcc499958864df5301e940bca0a56f58fddf30ffc07777'],
            ['nginx', '4a73073bd557c65b759505da037898b61f1be6cbcc3c2c3aeac22d2a470c1752'],
            ['node', 'c921b97d4b74f51744057454b306b418cf693865e73b8100559189605f6955b8'],
            ['node', '9ec4a2e289874ed0d722e1772ec2de45d2801541db8612f3638b26f128c69ac2'],
            ['golang', '96123126ac58e910f4dd3619a8901e2fb6d1ad84b59b1232cac7c9ea65a8f888'],
          ];
          for (const [name, digest] of pins) {
            const response = await fetch(`https://mirror.gcr.io/v2/library/${name}/manifests/sha256:${digest}`, {
              headers: { Accept: 'application/vnd.oci.image.index.v1+json' },
              signal: AbortSignal.timeout(30_000), redirect: 'error',
            });
            if (!response.ok) throw new Error(`Pinned CI mirror unavailable: ${name}@sha256:${digest}`);
            const raw = Buffer.from(await response.arrayBuffer());
            if (createHash('sha256').update(raw).digest('hex') !== digest) throw new Error('Pinned CI mirror digest mismatch');
            console.log(`Verified CI mirror: ${name}@sha256:${digest}`);
          }
          NODE
          # Merge only the mirror setting in this ephemeral hosted runner.
          sudo python3 - <<'PYTHON'
          import json, os
          filename = '/etc/docker/daemon.json'
          config = {}
          if os.path.exists(filename):
              with open(filename) as source:
                  config = json.load(source)
          if not isinstance(config, dict):
              raise ValueError('Invalid runner daemon configuration')
          config['registry-mirrors'] = ['https://mirror.gcr.io']
          with open(filename, 'w') as target:
              json.dump(config, target)
              target.write('\n')
          PYTHON
          sudo dockerd --validate --config-file=/etc/docker/daemon.json
          # SIGHUP reloads registry mirrors without restarting the PostgreSQL service.
          sudo systemctl kill --kill-whom=main --signal=HUP docker.service
          mirror_ready=false
          for attempt in {1..15}; do
            if [[ "$(docker info --format '{{json .RegistryConfig.Mirrors}}')" == '["https://mirror.gcr.io/"]' ]]; then
              mirror_ready=true
              break
            fi
            sleep 1
          done
          test "$mirror_ready" = true
          test "$(docker inspect --format '{{.State.Health.Status}}' "$POSTGRES_SERVICE_ID")" = healthy
      - run: npm run bootstrap
      - run: npm run verify
      - name: Test preauthority CI setup with native Linux root
        if: github.event_name == 'workflow_dispatch' && startsWith(github.ref, 'refs/heads/') && inputs.publish_candidate_only == true && inputs.cms_image_only != true
        run: |
          set -euo pipefail
          sudo env PATH="$PATH" HOME=/root node --test tests/unit/payload-preauthority-ci-setup.test.mjs
      - name: Test route delivery with production Nginx image
        run: |
          docker run --rm \
            --mount "type=bind,source=${PWD},target=/repo,readonly" \
            --workdir /repo \
            --entrypoint sh \
            nginx:alpine@sha256:4a73073bd557c65b759505da037898b61f1be6cbcc3c2c3aeac22d2a470c1752 \
            -c 'command -v nginx && apk add --no-cache nodejs && node --test tests/unit/nginx-route-delivery.test.mjs'
      - name: Install isolated route browser tooling
        run: |
          npm install --prefix "$RUNNER_TEMP/portal-route-browser" --no-save --package-lock=false playwright@1.62.1
          node "$RUNNER_TEMP/portal-route-browser/node_modules/playwright/cli.js" install --with-deps chromium
      - name: Test route mounts through Nginx in Chromium
        timeout-minutes: 10
        run: |
          container="portal-route-qa-${GITHUB_RUN_ID}-${GITHUB_RUN_ATTEMPT}"
          trap 'docker rm --force "$container" >/dev/null 2>&1 || true' EXIT
          docker run --detach --name "$container" \
            --publish 127.0.0.1::80 \
            --mount "type=bind,source=${PWD}/public,target=/usr/share/nginx/html,readonly" \
            --mount "type=bind,source=${PWD}/nginx/nginx.conf,target=/etc/nginx/conf.d/default.conf,readonly" \
            nginx:alpine@sha256:4a73073bd557c65b759505da037898b61f1be6cbcc3c2c3aeac22d2a470c1752
          address=$(docker port "$container" 80/tcp)
          curl --fail --silent --show-error --retry 10 --retry-connrefused \
            --retry-delay 1 --max-time 5 --retry-max-time 30 \
            --output /dev/null "http://${address}/index.html"
          node scripts/test-route-recovery-browser.mjs \
            --base-url "http://${address}" \
            --playwright-module "$RUNNER_TEMP/portal-route-browser/node_modules/playwright/index.mjs"
      - name: Build CMS with synthetic build-only configuration
        env:
          CMS_BUILD_ONLY: "true"
          NEXT_TELEMETRY_DISABLED: "1"
        run: npm --prefix cms run build
      - name: Create migration setup databases
        env:
          PGPASSWORD: integration-test-admin-password
        run: |
          psql --host=127.0.0.1 --username=portal_admin --dbname=portal_test --set=ON_ERROR_STOP=1 --command="CREATE DATABASE portal_test_upgrade OWNER portal_admin"
          psql --host=127.0.0.1 --username=portal_admin --dbname=portal_test --set=ON_ERROR_STOP=1 --command="CREATE DATABASE portal_test_bootstrap OWNER portal_admin"
      - name: Test migrations against PostgreSQL
        env:
          NODE_ENV: test
          MIGRATION_TEST_DISPOSABLE: "true"
          MIGRATION_DATABASE_URL: postgresql://portal_admin:integration-test-admin-password@127.0.0.1:5432/portal_test
          PORTAL_API_DB_PASSWORD: integration-test-api-password
          PORTAL_CRON_DB_PASSWORD: integration-test-cron-password
        run: npm run test:migrations
      - name: Test migration upgrade setup against PostgreSQL
        env:
          NODE_ENV: test
          MIGRATION_TEST_DISPOSABLE: "true"
          MIGRATION_TEST_SETUP: upgrade
          MIGRATION_DATABASE_URL: postgresql://portal_admin:integration-test-admin-password@127.0.0.1:5432/portal_test_upgrade
          PORTAL_API_DB_PASSWORD: integration-test-api-password
          PORTAL_CRON_DB_PASSWORD: integration-test-cron-password
        run: npm run test:migrations
      - name: Test migration bootstrap setup against PostgreSQL
        env:
          NODE_ENV: test
          MIGRATION_TEST_DISPOSABLE: "true"
          MIGRATION_TEST_SETUP: bootstrap
          MIGRATION_DATABASE_URL: postgresql://portal_admin:integration-test-admin-password@127.0.0.1:5432/portal_test_bootstrap
          PORTAL_API_DB_PASSWORD: integration-test-api-password
          PORTAL_CRON_DB_PASSWORD: integration-test-cron-password
        run: npm run test:migrations
      - name: Test Owner News integration against PostgreSQL
        env:
          NODE_ENV: test
          MIGRATION_TEST_DISPOSABLE: "true"
          MIGRATION_DATABASE_URL: postgresql://portal_admin:integration-test-admin-password@127.0.0.1:5432/portal_test
          PORTAL_API_DB_PASSWORD: integration-test-api-password
          PORTAL_CRON_DB_PASSWORD: integration-test-cron-password
        run: node scripts/test-owner-news-integration.mjs
      - name: Test Academy integration against PostgreSQL
        env:
          NODE_ENV: test
          MIGRATION_TEST_DISPOSABLE: "true"
          MIGRATION_DATABASE_URL: postgresql://portal_admin:integration-test-admin-password@127.0.0.1:5432/portal_test
          PORTAL_API_DB_PASSWORD: integration-test-api-password
          PORTAL_CRON_DB_PASSWORD: integration-test-cron-password
        run: node scripts/test-academy.mjs
      - name: Build production images
        env:
          # The daemon-integrated builder uses the verified runner mirror config.
          BUILDX_BUILDER: default
        run: |
          set -euo pipefail
          docker buildx inspect default | grep --extended-regexp '^Driver:[[:space:]]+docker$'
          docker build --tag ownerinc-portal-api:${GITHUB_SHA} api
          docker build --tag ownerinc-portal-cron:${GITHUB_SHA} --file cron/Dockerfile .
          docker build --tag ownerinc-portal-cms:${GITHUB_SHA} --file cms/Dockerfile .
      - name: Test editorial admin session v2 against disposable PostgreSQL and Firebase Auth
        if: github.event_name == 'workflow_dispatch' && startsWith(github.ref, 'refs/heads/') && inputs.publish_candidate_only == true && inputs.cms_image_only != true
        timeout-minutes: 15
        env:
          NODE_ENV: test
          MIGRATION_TEST_DISPOSABLE: "true"
          PORTAL_TEST_API_IMAGE: ownerinc-portal-api:${{ github.sha }}
          PORTAL_TEST_FIREBASE_PROJECT_ID: demo-ownerinc-${{ github.run_id }}-${{ github.run_attempt }}
        run: node scripts/test-editorial-admin-session-integration.mjs
      - name: Upload redacted API-v2 failure report
        if: ${{ always() && inputs.publish_candidate_only == true && failure() }}
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: editorial-admin-session-failure-report
          path: ${{ runner.temp }}/editorial-admin-session-report.json
          if-no-files-found: ignore
          retention-days: 7
      - name: Scan API image
        uses: aquasecurity/trivy-action@ed142fd0673e97e23eac54620cfb913e5ce36c25 # v0.36.0
        with:
          image-ref: ownerinc-portal-api:${{ github.sha }}
          severity: HIGH,CRITICAL
          ignore-unfixed: true
          exit-code: 1
      - name: Scan cron image
        uses: aquasecurity/trivy-action@ed142fd0673e97e23eac54620cfb913e5ce36c25 # v0.36.0
        with:
          image-ref: ownerinc-portal-cron:${{ github.sha }}
          severity: HIGH,CRITICAL
          ignore-unfixed: true
          exit-code: 1
      - name: Scan CMS image
        uses: aquasecurity/trivy-action@ed142fd0673e97e23eac54620cfb913e5ce36c25 # v0.36.0
        with:
          version: v0.75.0
          image-ref: ownerinc-portal-cms:${{ github.sha }}
          severity: HIGH,CRITICAL
          ignore-unfixed: true
          exit-code: 1
      - name: Reject high or critical production dependency vulnerabilities
        run: npm run security
      - name: Generate SPDX SBOMs
        run: npm run sbom
      - uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: sbom-spdx
          path: '*.spdx.json'
      - name: Authenticate to GHCR
        if: >-
          (((github.event_name == 'push' || github.event_name == 'workflow_dispatch') &&
          github.ref == 'refs/heads/main' && inputs.cms_image_only != true && inputs.publish_candidate_only != true) ||
          (github.event_name == 'workflow_dispatch' && startsWith(github.ref, 'refs/heads/') && inputs.cms_image_only == true && inputs.publish_candidate_only != true) ||
          (github.event_name == 'workflow_dispatch' && startsWith(github.ref, 'refs/heads/') && inputs.publish_candidate_only == true && inputs.cms_image_only != true))
        uses: docker/login-action@abd2ef45e78c5afb21d64d4ca52ee8550d9572c7 # v4.5.1
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}
      - name: Publish immutable images
        id: publish
        if: >-
          (((github.event_name == 'push' || github.event_name == 'workflow_dispatch') &&
          github.ref == 'refs/heads/main' && inputs.cms_image_only != true && inputs.publish_candidate_only != true) ||
          (github.event_name == 'workflow_dispatch' && startsWith(github.ref, 'refs/heads/') && inputs.publish_candidate_only == true && inputs.cms_image_only != true))
        env:
          REGISTRY: ghcr.io/ownerinc
        run: |
          set -euo pipefail
          [[ "$GITHUB_SHA" =~ ^[0-9a-f]{40}$ ]]
          docker tag ownerinc-portal-api:${GITHUB_SHA} ${REGISTRY}/ownerinc-portal-api:${GITHUB_SHA}
          docker tag ownerinc-portal-cron:${GITHUB_SHA} ${REGISTRY}/ownerinc-portal-cron:${GITHUB_SHA}
          docker push ${REGISTRY}/ownerinc-portal-api:${GITHUB_SHA}
          docker push ${REGISTRY}/ownerinc-portal-cron:${GITHUB_SHA}
          api_image=$(docker inspect --format='{{index .RepoDigests 0}}' ${REGISTRY}/ownerinc-portal-api:${GITHUB_SHA})
          cron_image=$(docker inspect --format='{{index .RepoDigests 0}}' ${REGISTRY}/ownerinc-portal-cron:${GITHUB_SHA})
          [[ "$api_image" =~ ^ghcr\.io/ownerinc/ownerinc-portal-api@sha256:[0-9a-f]{64}$ ]]
          [[ "$cron_image" =~ ^ghcr\.io/ownerinc/ownerinc-portal-cron@sha256:[0-9a-f]{64}$ ]]
          printf '%s\n%s\n' "$api_image" "$cron_image" > image-digests.txt
          echo "api_image=$api_image" >> "$GITHUB_OUTPUT"
          echo "cron_image=$cron_image" >> "$GITHUB_OUTPUT"

      - name: Publish CMS immutable image
        id: publish_cms
        if: >-
          (((github.event_name == 'push' || github.event_name == 'workflow_dispatch') &&
          github.ref == 'refs/heads/main' && inputs.cms_image_only != true && inputs.publish_candidate_only != true) ||
          (github.event_name == 'workflow_dispatch' && startsWith(github.ref, 'refs/heads/') && inputs.cms_image_only == true && inputs.publish_candidate_only != true) ||
          (github.event_name == 'workflow_dispatch' && startsWith(github.ref, 'refs/heads/') && inputs.publish_candidate_only == true && inputs.cms_image_only != true))
        env:
          REGISTRY: ghcr.io/ownerinc
        run: |
          set -euo pipefail
          [[ "$GITHUB_SHA" =~ ^[0-9a-f]{40}$ ]]
          docker tag ownerinc-portal-cms:${GITHUB_SHA} ${REGISTRY}/ownerinc-portal-cms:${GITHUB_SHA}
          docker push ${REGISTRY}/ownerinc-portal-cms:${GITHUB_SHA}
          cms_image=$(docker inspect --format='{{index .RepoDigests 0}}' ${REGISTRY}/ownerinc-portal-cms:${GITHUB_SHA})
          [[ "$cms_image" =~ ^ghcr\.io/ownerinc/ownerinc-portal-cms@sha256:[0-9a-f]{64}$ ]]
          printf '%s\n' "$cms_image" > cms-image-digest.txt
          printf '%s\n' "$GITHUB_SHA" > cms-image-source.txt
          echo "cms_image=$cms_image" >> "$GITHUB_OUTPUT"
      - name: Capture complete immutable release candidate manifest
        if: github.event_name == 'workflow_dispatch' && startsWith(github.ref, 'refs/heads/') && inputs.publish_candidate_only == true && inputs.cms_image_only != true
        env:
          API_IMAGE: ${{ steps.publish.outputs.api_image }}
          CRON_IMAGE: ${{ steps.publish.outputs.cron_image }}
          CMS_IMAGE: ${{ steps.publish_cms.outputs.cms_image }}
        run: |
          set -euo pipefail
          [[ "$GITHUB_SHA" =~ ^[0-9a-f]{40}$ ]]
          [[ "$GITHUB_RUN_ID" =~ ^[0-9]+$ ]]
          [[ "$GITHUB_RUN_ATTEMPT" =~ ^[0-9]+$ ]]
          [[ "$API_IMAGE" =~ ^ghcr\.io/ownerinc/ownerinc-portal-api@sha256:[0-9a-f]{64}$ ]]
          [[ "$CRON_IMAGE" =~ ^ghcr\.io/ownerinc/ownerinc-portal-cron@sha256:[0-9a-f]{64}$ ]]
          [[ "$CMS_IMAGE" =~ ^ghcr\.io/ownerinc/ownerinc-portal-cms@sha256:[0-9a-f]{64}$ ]]
          node <<'NODE'
          const fs = require('node:fs');
          const candidate = {
            schemaVersion: 1,
            commit: process.env.GITHUB_SHA,
            runId: process.env.GITHUB_RUN_ID,
            runAttempt: process.env.GITHUB_RUN_ATTEMPT,
            images: { api: process.env.API_IMAGE, cron: process.env.CRON_IMAGE, cms: process.env.CMS_IMAGE },
          };
          fs.writeFileSync('candidate.json', `${JSON.stringify(candidate, null, 2)}\n`, { mode: 0o600, flag: 'wx' });
          NODE
      - uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        if: >-
          (github.event_name == 'push' || github.event_name == 'workflow_dispatch') &&
          github.ref == 'refs/heads/main' && inputs.cms_image_only != true && inputs.publish_candidate_only != true
        with:
          name: image-digests
          path: image-digests.txt
      - uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        if: >-
          (((github.event_name == 'push' || github.event_name == 'workflow_dispatch') &&
          github.ref == 'refs/heads/main' && inputs.cms_image_only != true && inputs.publish_candidate_only != true) ||
          (github.event_name == 'workflow_dispatch' && startsWith(github.ref, 'refs/heads/') && inputs.cms_image_only == true && inputs.publish_candidate_only != true) ||
          (github.event_name == 'workflow_dispatch' && startsWith(github.ref, 'refs/heads/') && inputs.publish_candidate_only == true && inputs.cms_image_only != true))
        with:
          name: cms-image-digest
          path: |
            cms-image-digest.txt
            cms-image-source.txt
      - name: Upload unqualified candidate image manifest
        id: upload_candidate
        if: github.event_name == 'workflow_dispatch' && startsWith(github.ref, 'refs/heads/') && inputs.publish_candidate_only == true && inputs.cms_image_only != true
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: payload-release-candidate
          path: candidate.json
          if-no-files-found: error
          retention-days: 30
      - name: Pull exact published candidate image digests for root-owned fixture
        if: github.event_name == 'workflow_dispatch' && startsWith(github.ref, 'refs/heads/') && inputs.publish_candidate_only == true && inputs.cms_image_only != true
        env:
          API_IMAGE: ${{ steps.publish.outputs.api_image }}
          CRON_IMAGE: ${{ steps.publish.outputs.cron_image }}
          CMS_IMAGE: ${{ steps.publish_cms.outputs.cms_image }}
        run: |
          set -euo pipefail
          docker pull "$API_IMAGE"
          docker pull "$CRON_IMAGE"
          docker pull "$CMS_IMAGE"
      - name: Run disposable four-store preauthority recovery on published digests
        if: github.event_name == 'workflow_dispatch' && startsWith(github.ref, 'refs/heads/') && inputs.publish_candidate_only == true && inputs.cms_image_only != true
        timeout-minutes: 60
        env:
          API_IMAGE: ${{ steps.publish.outputs.api_image }}
          CRON_IMAGE: ${{ steps.publish.outputs.cron_image }}
          CMS_IMAGE: ${{ steps.publish_cms.outputs.cms_image }}
          RECOVERY_REPORT: ${{ runner.temp }}/payload-preauthority-recovery-report.json
        run: |
          set -euo pipefail
          sudo env \
            PATH="$PATH" HOME=/root \
            API_IMAGE="$API_IMAGE" CRON_IMAGE="$CRON_IMAGE" CMS_IMAGE="$CMS_IMAGE" \
            GITHUB_SHA="$GITHUB_SHA" GITHUB_RUN_ID="$GITHUB_RUN_ID" \
            GITHUB_RUN_ATTEMPT="$GITHUB_RUN_ATTEMPT" RUNNER_TEMP="$RUNNER_TEMP" \
            PAYLOAD_RECOVERY_REPORT="$RECOVERY_REPORT" \
            node scripts/test-payload-preauthority-recovery.mjs
      - name: Upload redacted preauthority recovery report
        id: upload_recovery_report
        if: ${{ always() && inputs.publish_candidate_only == true && inputs.cms_image_only != true }}
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: payload-preauthority-recovery-report
          path: ${{ runner.temp }}/payload-preauthority-recovery-report.json
          if-no-files-found: ignore
          retention-days: 30
      - name: Create recovery-qualified candidate manifest
        if: success() && github.event_name == 'workflow_dispatch' && startsWith(github.ref, 'refs/heads/') && inputs.publish_candidate_only == true && inputs.cms_image_only != true
        env:
          API_IMAGE: ${{ steps.publish.outputs.api_image }}
          CRON_IMAGE: ${{ steps.publish.outputs.cron_image }}
          CMS_IMAGE: ${{ steps.publish_cms.outputs.cms_image }}
          RECOVERY_REPORT: ${{ runner.temp }}/payload-preauthority-recovery-report.json
        run: |
          set -euo pipefail
          node scripts/qualify-payload-candidate.mjs \
            --candidate candidate.json --report "$RECOVERY_REPORT" \
            --output qualified-candidate.json
      - uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        id: upload_qualified
        if: success() && github.event_name == 'workflow_dispatch' && startsWith(github.ref, 'refs/heads/') && inputs.publish_candidate_only == true && inputs.cms_image_only != true
        with:
          name: payload-recovery-qualified-candidate
          path: qualified-candidate.json
          if-no-files-found: error
          retention-days: 30

  deploy-production:
    name: Deploy production
    needs: validate
    if: (github.event_name == 'push' || github.event_name == 'workflow_dispatch') && github.ref == 'refs/heads/main' && inputs.cms_image_only != true && inputs.publish_candidate_only != true
    environment: production
    runs-on: ubuntu-latest
    timeout-minutes: 25
    concurrency:
      group: portal-ownerinc-production
      cancel-in-progress: false
    permissions:
      contents: read
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - name: Package the exact validated commit
        env:
          API_IMAGE: ${{ needs.validate.outputs.api_image }}
          CRON_IMAGE: ${{ needs.validate.outputs.cron_image }}
        run: |
          printf '%s\n%s\n' "$API_IMAGE" "$CRON_IMAGE" > .ci-images
          git archive --format=tar --add-virtual-file=".ci-commit:${GITHUB_SHA}" --output=portal-release.tar "${GITHUB_SHA}"
          tar --append --file=portal-release.tar .ci-images
          gzip --stdout portal-release.tar > portal-release.tar.gz
          rm -f .ci-images portal-release.tar
      - name: Configure restricted production SSH
        env:
          SSH_PRIVATE_KEY: ${{ secrets.PORTAL_VPS_SSH_KEY }}
          SSH_KNOWN_HOSTS: ${{ secrets.PORTAL_VPS_KNOWN_HOSTS }}
        run: |
          install -d -m 700 "$HOME/.ssh"
          printf '%s\n' "$SSH_PRIVATE_KEY" > "$HOME/.ssh/portal_ownerinc_ci"
          printf '%s\n' "$SSH_KNOWN_HOSTS" > "$HOME/.ssh/known_hosts"
          chmod 600 "$HOME/.ssh/portal_ownerinc_ci" "$HOME/.ssh/known_hosts"
      - name: Deploy with backup, migration, smoke and rollback
        env:
          VPS_HOST: ${{ secrets.PORTAL_VPS_HOST }}
          VPS_PORT: ${{ secrets.PORTAL_VPS_PORT }}
          VPS_USER: ${{ secrets.PORTAL_VPS_USER }}
        run: |
          [[ "$VPS_HOST" =~ ^[A-Za-z0-9.-]+$ ]]
          [[ "$VPS_PORT" =~ ^[0-9]+$ ]]
          [[ "$VPS_USER" =~ ^[a-z_][a-z0-9_-]*$ ]]
          test "$VPS_USER" != root
          for attempt in 1 2 3; do
            if ssh -i "$HOME/.ssh/portal_ownerinc_ci" \
              -p "$VPS_PORT" \
              -o BatchMode=yes \
              -o ConnectTimeout=15 \
              -o IdentitiesOnly=yes \
              -o StrictHostKeyChecking=yes \
              "$VPS_USER@$VPS_HOST" "$GITHUB_SHA" < portal-release.tar.gz; then
              exit 0
            else
              status=$?
            fi
            if (( status != 255 || attempt == 3 )); then
              exit "$status"
            fi
            sleep $((attempt * 10))
          done
