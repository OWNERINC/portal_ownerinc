networks:
  backend:
    driver: bridge

services:
  postgres:
    networks: [backend]

  migrate:
    networks: [backend]

  api:
    networks: [backend]

  cron:
    networks: [backend]
    environment:
      CRON_BOOTSTRAP_ONLY: "true"

  nginx:
    ports:
      - "127.0.0.1:${HTTP_PORT:?}:80"
    networks: [backend]

  cms-provision:
    networks: [backend]

  cms-control-roles:
    networks: [backend]

  cms-migrate:
    networks: [backend]

  cms-preauthority-verify:
    networks: [backend]

  cms:
    networks: [backend]
    # The preauthority floor deliberately has no native mutation protocol yet,
    # so production readiness must remain closed. This disposable recovery
    # fixture needs only process liveness while it snapshots/restores the four
    # stores; the runner separately proves /editorial/ready still returns 503.
    healthcheck:
      test: [CMD, node, -e, 'fetch("http://127.0.0.1:3001/editorial/health",{signal:AbortSignal.timeout(3000)}).then(async r=>{await r.body?.cancel().catch(()=>{});process.exit(r.status===200?0:1)}).catch(()=>process.exit(1))']
