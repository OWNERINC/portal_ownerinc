# Installed only by Gate D after private readiness and exact release/container/image verification.
location = /editorial/api/portal-news { return 404; }
location ^~ /editorial/api/portal-news/ { return 404; }
location = /editorial/ready { return 404; }
location ^~ /editorial/ready/ { return 404; }
location = /editorial/health { return 404; }
location ^~ /editorial/health/ { return 404; }
location = /editorial/internal { return 404; }
location ^~ /editorial/internal/ { return 404; }
location = /editorial/api/internal { return 404; }
location ^~ /editorial/api/internal/ { return 404; }
location = /_next/image { return 404; }
location ^~ /_next/image/ { return 404; }

location = /editorial {
    absolute_redirect off;
    return 308 /editorial/admin;
}

location = /editorial/api/news-media {
    if ($cross_site_request) { return 403; }
    client_max_body_size 51m;
    proxy_request_buffering off;
    limit_req zone=editorial_uploads burst=2 nodelay;
    limit_req zone=media_reads burst=40 nodelay;
    proxy_pass $cms_upstream;
    proxy_intercept_errors on;
    error_page 502 503 504 = @editorial_unavailable;
    proxy_set_header Host $http_host;
    proxy_set_header X-Real-IP $remote_addr;
    proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
    proxy_set_header X-Forwarded-Host $http_host;
    proxy_set_header X-Forwarded-Proto $forwarded_proto;
    proxy_set_header X-Forwarded-Port "";
    proxy_set_header X-Portal-Service-Key "";
    proxy_set_header X-Ownerinc-Auth-Status "";
    proxy_set_header X-Ownerinc-Auth-Reason "";
}

location = /editorial/api/news-media/ {
    if ($cross_site_request) { return 403; }
    client_max_body_size 51m;
    proxy_request_buffering off;
    limit_req zone=editorial_uploads burst=2 nodelay;
    limit_req zone=media_reads burst=40 nodelay;
    proxy_pass $cms_upstream;
    proxy_intercept_errors on;
    error_page 502 503 504 = @editorial_unavailable;
    proxy_set_header Host $http_host;
    proxy_set_header X-Real-IP $remote_addr;
    proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
    proxy_set_header X-Forwarded-Host $http_host;
    proxy_set_header X-Forwarded-Proto $forwarded_proto;
    proxy_set_header X-Forwarded-Port "";
    proxy_set_header X-Portal-Service-Key "";
    proxy_set_header X-Ownerinc-Auth-Status "";
    proxy_set_header X-Ownerinc-Auth-Reason "";
}

location ^~ /editorial/ {
    if ($cross_site_request) { return 403; }
    client_max_body_size 6m;
    limit_req zone=editorial burst=40 nodelay;
    proxy_pass $cms_upstream;
    proxy_intercept_errors on;
    error_page 502 503 504 = @editorial_unavailable;
    proxy_http_version 1.1;
    proxy_set_header Host $http_host;
    proxy_set_header X-Real-IP $remote_addr;
    proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
    proxy_set_header X-Forwarded-Host $http_host;
    proxy_set_header X-Forwarded-Proto $forwarded_proto;
    proxy_set_header X-Forwarded-Port "";
    proxy_set_header X-Portal-Service-Key "";
    proxy_set_header X-Ownerinc-Auth-Status "";
    proxy_set_header X-Ownerinc-Auth-Reason "";
    proxy_set_header Upgrade $http_upgrade;
    proxy_set_header Connection $editorial_connection_upgrade;
    proxy_read_timeout 60s;
}

location ^~ /_next/static/ {
    if ($cross_site_request) { return 403; }
    client_max_body_size 100k;
    limit_req zone=editorial burst=40 nodelay;
    proxy_pass $cms_upstream;
    proxy_intercept_errors on;
    error_page 502 503 504 = @editorial_unavailable;
    proxy_set_header Host $http_host;
    proxy_set_header X-Real-IP $remote_addr;
    proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
    proxy_set_header X-Forwarded-Host $http_host;
    proxy_set_header X-Forwarded-Proto $forwarded_proto;
    proxy_set_header X-Forwarded-Port "";
    proxy_set_header X-Portal-Service-Key "";
    proxy_set_header X-Ownerinc-Auth-Status "";
    proxy_set_header X-Ownerinc-Auth-Reason "";
}

location ^~ /_next/ { return 404; }

location @editorial_unavailable {
    default_type application/json;
    add_header Referrer-Policy "strict-origin-when-cross-origin" always;
    add_header Strict-Transport-Security "max-age=31536000; includeSubDomains" always;
    add_header X-Content-Type-Options "nosniff" always;
    add_header X-Frame-Options "DENY" always;
    add_header Permissions-Policy "camera=(), geolocation=(), microphone=()" always;
    add_header Cache-Control "no-store" always;
    add_header Retry-After "5" always;
    return 503 '{"error":"editorial_unavailable"}';
}
